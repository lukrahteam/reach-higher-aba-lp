  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-rh-teal-500:#178089;\n  --rh-teal-100:#d4e6e7;\n  --rh-teal-50:#eef5f5;\n\n  --rh-green-700:#00a56b;\n  --rh-green-600:#00bd7a;\n  --rh-green-500:#00d389;  /* primary brand green (wordmark \"Higher\", star, swoosh) */\n  --rh-green-400:#3ee0a4;\n  --rh-green-200:#a9f0d5;\n  --rh-green-100:#d6f8ea;\n  --rh-green-50:#ecfdf5;\n\n  /* Neutrals \u2014 warm-cool gray tuned toward the teal */\n  --rh-white:#ffffff;\n  --rh-ink-900:#0a2226;    /* darkest text */\n  --rh-ink-700:#274a4f;    /* body text */\n  --rh-ink-500:#5b7a7e;    /* muted text */\n  --rh-ink-300:#9db3b5;    /* faint / placeholder */\n  --rh-line:#dce7e7;       /* hairline borders */\n  --rh-surface:#f4f9f8;    /* tinted surface */\n  --rh-surface-2:#eaf3f2;\n\n  /* Semantic \u2014 surfaces */\n  --surface-page:var(--rh-white);\n  --surface-subtle:var(--rh-surface);\n  --surface-card:var(--rh-white);\n  --surface-inverse:var(--rh-teal-700);\n  --surface-brand:var(--rh-green-500);\n\n  /* Semantic \u2014 text */\n  --text-strong:var(--rh-ink-900);\n  --text-body:var(--rh-ink-700);\n  --text-muted:var(--rh-ink-500);\n  --text-on-brand:var(--rh-teal-900);   /* dark text reads best on the green */\n  --text-on-inverse:var(--rh-white);\n  --text-link:var(--rh-teal-700);\n  --text-link-hover:var(--rh-green-600);\n\n  /* Semantic \u2014 lines & focus */\n  --border-subtle:var(--rh-line);\n  --border-strong:var(--rh-teal-700);\n  --focus-ring:color-mix(in srgb, var(--rh-green-500) 55%, transparent);\n\n  /* Semantic \u2014 actions */\n  --action-primary:var(--rh-green-500);\n  --action-primary-hover:var(--rh-green-600);\n  --action-primary-press:var(--rh-green-700);\n  --action-secondary:var(--rh-teal-700);\n  --action-secondary-hover:var(--rh-teal-800);\n\n  /* Status */\n  --status-success:var(--rh-green-600);\n  --status-info:var(--rh-teal-600);\n  --status-warning:#e6a100;\n  --status-danger:#d64545;\n}<\/style>\n<style>/* Reach Higher ABA \u2014 Typography tokens */\n:root{\n  /* Families */\n  --font-display:'Poppins','Segoe UI',system-ui,sans-serif;  /* headings, wordmark, buttons */\n  --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif; /* paragraphs, UI text */\n\n  /* Weights */\n  --fw-regular:400; /* @kind font */\n  --fw-medium:500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */\n\n  /* Type scale \u2014 display uses Poppins, tuned for a warm, confident marketing voice */\n  --fs-display:clamp(2.75rem,1.6rem+4.2vw,4.5rem); /* @kind font */\n  --fs-h1:clamp(2.25rem,1.5rem+2.6vw,3.25rem); /* @kind font */\n  --fs-h2:clamp(1.75rem,1.3rem+1.6vw,2.5rem); /* @kind font */\n  --fs-h3:1.5rem; /* 24 @kind font */\n  --fs-h4:1.25rem; /* 20 @kind font */\n  --fs-lead:1.25rem; /* 20 intro @kind font */\n  --fs-body:1.0625rem; /* 17 @kind font */\n  --fs-sm:0.9375rem; /* 15 @kind font */\n  --fs-xs:0.8125rem; /* 13 @kind font */\n  --fs-eyebrow:0.8125rem; /* 13 label @kind font */\n\n  /* Line heights */\n  --lh-tight:1.08; /* @kind font */\n  --lh-heading:1.18; /* @kind font */\n  --lh-snug:1.4; /* @kind font */\n  --lh-body:1.65; /* @kind font */\n\n  /* Letter spacing */\n  --ls-display:-0.02em; /* @kind font */\n  --ls-heading:-0.01em; /* @kind font */\n  --ls-eyebrow:0.14em; /* @kind font */\n  --ls-normal:0; /* @kind font */\n}\n\n/* Base element defaults so consumers get the brand voice for free */\nbody{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body);-webkit-font-smoothing:antialiased;}\nh1,h2,h3,h4,h5,h6{font-family:var(--font-display);color:var(--text-strong);line-height:var(--lh-heading);letter-spacing:var(--ls-heading);font-weight:var(--fw-bold);margin:0;}\na{color:var(--text-link);text-decoration:none;}\na:hover{color:var(--text-link-hover);}<\/style>\n<style>/* Reach Higher ABA \u2014 Spacing, radius, shadow, layout tokens */\n:root{\n  /* Spacing scale (4px base) */\n  --space-0:0;\n  --space-1:4px;\n  --space-2:8 -rh-teal-700);\n  --surface-brand:var(--rh-green-500);\n\n  /* Semantic \u2014 text */\n  --text-strong:var(--rh-ink-900);\n  --text-body:var(--rh-ink-700);\n  --text-muted:var(--rh-ink-500);\n  --text-on-brand:var(--rh-teal-900);   /* dark text reads best on the green */\n  --text-on-inverse:var(--rh-white);\n  --text-link:var(--rh-teal-700);\n  --text-link-hover:var(--rh-green-600);\n\n  /* Semantic \u2014 lines & focus */\n  --border-subtle:var(--rh-line);\n  --border-strong:var(--rh-teal-700);\n  --focus-ring:color-mix(in srgb, var(--rh-green-500) 55%, transparent);\n\n  /* Semantic \u2014 actions */\n  --action-primary:var(--rh-green-500);\n  --action-primary-hover:var(--rh-green-600);\n  --action-primary-press:var(--rh-green-700);\n  --action-secondary:var(--rh-teal-700);\n  --action-secondary-hover:var(--rh-teal-800);\n\n  /* Status */\n  --status-success:var(--rh-green-600);\n  --status-info:var(--rh-teal-600);\n  --status-warning:#e6a100;\n  --status-danger:#d64545;\n}\n/* Reach Higher ABA \u2014 Typography tokens */\n:root{\n  /* Families */\n  --font-display:'Poppins','Segoe UI',system-ui,sans-serif;  /* headings, wordmark, buttons */\n  --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif; /* paragraphs, UI text */\n\n  /* Weights */\n  --fw-regular:400; /* @kind font */\n  --fw-medium:500; /* @kind font */\n  --fw-semibold:600; /* @kind font */\n  --fw-bold:700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */\n\n  /* Type scale \u2014 display uses Poppins, tuned for a warm, confident marketing voice */\n  --fs-display:clamp(2.75rem,1.6rem+4.2vw,4.5rem); /* @kind font */\n  --fs-h1:clamp(2.25rem,1.5rem+2.6vw,3.25rem); /* @kind font */\n  --fs-h2:clamp(1.75rem,1.3rem+1.6vw,2.5rem); /* @kind font */\n  --fs-h3:1.5rem; /* 24 @kind font */\n  --fs-h4:1.25rem; /* 20 @kind font */\n  --fs-lead:1.25rem; /* 20 intro @kind font */\n  --fs-body:1.0625rem; /* 17 @kind font */\n  --fs-sm:0.9375rem; /* 15 @kind font */\n  --fs-xs:0.8125rem; /* 13 @kind font */\n  --fs-eyebrow:0.8125rem; /* 13 label @kind font */\n\n  /* Line heights */\n  --lh-tight:1.08; /* @kind font */\n  --lh-heading:1.18; /* @kind font */\n  --lh-snug:1.4; /* @kind font */\n  --lh-body:1.65; /* @kind font */\n\n  /* Letter spacing */\n  --ls-display:-0.02em; /* @kind font */\n  --ls-heading:-0.01em; /* @kind font */\n  --ls-eyebrow:0.14em; /* @kind font */\n  --ls-normal:0; /* @kind font */\n}\n\n/* Base element defaults so consumers get the brand voice for free */\nbody{font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-body);-webkit-font-smoothing:antialiased;}\nh1,h2,h3,h4,h5,h6{font-family:var(--font-display);color:var(--text-strong);line-height:var(--lh-heading);letter-spacing:var(--ls-heading);font-weight:var(--fw-bold);margin:0;}\na{color:var(--text-link);text-decoration:none;}\na:hover{color:var(--text-link-hover);}\n/* Reach Higher ABA \u2014 Spacing, radius, shadow, layout tokens */\n:root{\n  /* Spacing scale (4px base) */\n  --space-0:0;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  /* Radius \u2014 the brand leans friendly & rounded (pill buttons, soft cards) */\n  --radius-xs:6px;\n  --radius-sm:10px;\n  --radius-md:16px;\n  --radius-lg:24px;\n  --radius-xl:32px;\n  --radius-pill:999px;\n  --radius-card:var(--radius-lg);\n\n  /* Shadows \u2014 soft, tinted with the brand teal, never harsh black */\n  --shadow-xs:0 1px 2px rgba(6,47,51,.06);\n  --shadow-sm:0 2px 8px rgba(6,47,51,.08);\n  --shadow-md:0 10px 24px rgba(6,47,51,.10);\n  --shadow-lg:0 20px 48px rgba(6,47,51,.14);\n  --shadow-brand:0 16px 40px rgba(0,211,137,.28); /* green glow for primary CTAs */\n\n  /* Layout */\n  --container-max:1200px; /* @kind spacing */\n  --container-pad:24px; /* @kind spacing */\n  --secti -g2 { grid-template-columns: 1fr; }\n  }\n  @media (max-width: 768px) {\n    .rh-callbar { display: flex; }\n    body { padding-bottom: 84px; }\n    .rh-h1 { font-size: 40px !important; }\n  }\n<\/style>\n<\/helmet>\n\n<div style=\"font-family: var(--font-body); color: var(--text-body); background: var(--rh-surface);\">\n\n  <!-- ============ 1. HERO ============ -->\n  <section style=\"background: linear-gradient(160deg, var(--rh-teal-800) 0%, var(--rh-teal-700) 55%, var(--rh-teal-600) 100%); position: relative; overflow: hidden;\">\n    <div style=\"position: absolute; top: -80px; right: -60px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--rh-green-500) 30%, transparent), transparent 70%);\"><\/div>\n    <div class=\"rh-wrap\" style=\"padding-top: 40px; padding-bottom: 72px; position: relative;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; padding-bottom: 40px;\">\n        <img src=\"43c3215e-5c6a-418c-bad7-801c68b490b5\" alt=\"Reach Higher ABA\" style=\"height: 54px; width: auto; display: block;\">\n        <a href=\"tel:+13853803211\" style=\"display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: #fff; text-decoration: none; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); padding: 10px 18px; border-radius: var(--radius-pill);\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.57 3.6 1 1 0 01-.24 1l-2.23 2.2z\" fill=\"var(--rh-green-500)\"><\/path><\/svg>\n          (385) 380-3211\n        <\/a>\n      <\/div>\n\n      <div class=\"rh-hero-grid\">\n        <div style=\"animation: rh-fade 0.5s var(--ease-out) both;\">\n          <div style=\"display: i nt-display); font-weight: 600; font-size: 14px; padding: 8px 15px; border-radius: var(--radius-pill);\"><span style=\"color: var(--rh-green-500);\">\u2713<\/span> No waitlist<\/span>\n            <span style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 14px; padding: 8px 15px; border-radius: var(--radius-pill);\"><span style=\"color: var(--rh-green-500);\">\u2713<\/span> BCBA-led care<\/span>\n          <\/div>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 14px;\">\n            <a href=\"tel:+13853803211\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 30px; background: var(--rh-green-500); color: var(--rh-teal-900); font-family: var(--font-display); font-weight: 700; font-size: 18px; text-decoration: none; border-radius: var(--radius-pill); box-shadow: var(--shadow-brand);\">\n              <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.57 3.6 1 1 0 01-.24 1l-2.23 2.2z\" fill=\"currentColor\"><\/path><\/svg>\n              Call now: (385) 380-3211\n            <\/a>\n            <a href=\"#quiz\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px; background: transparent; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 17px; text-decoration: none; border: 2px solid rgba(255,255,255,0.35); border-radius: var(--radius-pill);\">See if we're the right fit<\/a>\n          <\/div>\n        <\/div>\n\n        <div style=\"animation: rh-fade 0.6s var(--ease-out) both; position: relative;\">\n          <img src=\"2b60b70f-bd37-49b1-8ae9-f324dc2420bb\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; top: -34px; right: -18px; width: 96px; height: auto; z-index: 2; filter: drop-shadow(0 6px 14px rgba(0,211,137,0.35));\">\n          <img src=\"https://images.unsplash.com/photo-1491013516836-7db643ee125a?w=700&q=80&fit=crop\" style=\"aspect-ratio:4/3.4;border-radius:28px;width:100%;object-fit:cover;display:block;box-shadow:0 20px 60px rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.14);\" />\n\n          <div style=\"position: absolute; left: -18px; bottom: -26px; width: min(300px, 82%); background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start;\">\n            <span style=\"width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: var(--rh-teal-100); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; color: var(--rh-teal-700); font-size: 18px;\">SC<\/span>\n            <div>\n              <p style=\"margin: 0 0 6px; font-size: 14px; line-height: 1.5; color: var(--text-body);\">\u201cWe build the plan around your child \u2014 then teach you the tools to keep the momentum going at home.\u201d<\/p>\n              <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--text-strong);\">Dr. Sarah Chen, BCBA-D<\/div>\n              <div style=\"font-size: 12px; color: var(--text-muted);\">Clinical Director<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ============ 2. QUALIFYING QUIZ + FORM ============ -->\n  <section id=\"quiz\" style=\"background: var(--rh-white); padding: var(--section-y) 0; scroll-margin-top: 12px;\">\n    <div class=\"rh-wrap\">\n      <div class=\"rh-quiz-grid\">\n        <div>\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rh-green-700); margin-bottom: 12px;\">Free 60-second check<\/div>\n          <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1.1; letter-spacing: -0.02em; color: var(--text-strong); margin: 0 0 16px;\">See if we're the right fit for your family<\/h2>\n          <p style=\"font-size: 18px; line-height: 1.6; margin: 0 0 24px;\">Answer three quick questions and we'll tell you right away whether Reach Higher can help \u2014 then verify your insurance benefits for you, at no cost.<\/p>\n          <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px;\">\n            <li style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 16px;\"><span style=\"color: var(--rh-green-600); font-weight: 800;\">\u2713<\/span> No obligation \u2014 just a real answer<\/li>\n            <li style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 16px;\"><span style=\"color: var(--rh-green-600); font-weight: 800;\">\u2713<\/span> We handle billing &amp; insurance paperwork<\/li>\n            <li style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 16px;\"><span style=\"color: var(--rh-green-600); font-weight: 800;\">\u2713<\/span> Speak with a BCBA, not a call center<\/li>\n          <\/ul>\n        <\/div>\n\n        <div style=\"background: var(--rh-surface); border: 1px solid var(--border-subtle); border-radius: 24px; box-shadow: var(--shadow-md); padding: 32px; min-height: 420px;\">\n          <!-- progress -->\n          <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;\">\n              <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text-muted);\">Question {{ stepNum }} of 3<\/span>\n              <div style=\"flex: 1; height: 6px; background: var(--rh-green-100); border-radius: 999px; margin-left: 16px; overflow: hidden;\">\n                <div style=\"height: 100%; border-radius: 999px; background: var(--rh-green-500); transition: width var(--dur-slow) var(--ease-out); width: {{ progressWidth }};\"><\/div>\n              <\/div>\n            <\/div>\n          <\/sc-if>\n\n          <!-- Q1 -->\n          <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"animation: rh-fade 0.35s var(--ease-out) both;\">\n              <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 23px; color: var(--text-strong); margin: 0 0 20px; line-height: 1.25;\">How old is your child?<\/h3>\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <sc-for list=\"{{ q1Options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\" sc-camel-on-mouse-over=\"{{ opt.onOver }}\" sc-camel-on-mouse-out=\"{{ opt.onOut }}\">{{ opt.label }}<\/button>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n          <\/sc-if>\n\n          <!-- Q2 -->\n          <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation: rh-fade 0.35s var(--ease-out) both;\">\n              <h3 style=\"font-family: var(--font-display); font-weight: 700; font-size: 23px; color: var(--text-strong); margin: 0 0 20px; line-height: 1.25;\">Does your child have an autism diagnosis?<\/h3>\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <sc-for list=\"{{ q2Options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\" sc-camel-on-mouse-over=\"{{ opt.onOver }}\" sc-camel-on-mouse-out=\"{{ opt.onOut }}\">{{ opt.label }}<\/button>\n                <\/sc-for>\n              <\/div>\n div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 20px;\">\n            <img src=\"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200&q=80&fit=crop&crop=face\" style=\"width:88px;height:88px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow-md);\" />\n            <img src=\"2b60b70f-bd37-49b1-8ae9-f324dc2420bb\" alt=\"\" aria-hidden=\"true\" style=\"width: 34px; height: auto; margin-left: auto; opacity: 0.9;\">\n          <\/div>\n          <h3 style=\"font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--text-strong); margin: 0 0 6px;\">Your BCBA<\/h3>\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--rh-green-700); margin-bottom: 14px;\">Board Certified Behavior Analyst<\/div>\n          <p style=\"font-size: 16px; line-height: 1.65; margin: 0;\">Your BCBA designs and oversees your child's individualized plan, tracks progress, adjusts goals, and trains you as a caregiver \u2014 so the whole family moves forward together.<\/p>\n        <\/div>\n        <div style=\"background: var(--rh-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 34px; display: flex; flex-direction: column;\">\n          <div style=\"display: flex; align-items: center; gap: 18px; margin-bottom: 20px;\">\n            <img src=\"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80&fit=crop&crop=face\" style=\"width:88px;height:88px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow-md);\" />\n            <img src=\"2b60b70f-bd37-49b1-8ae9-f324dc2420bb\" alt=\"\" aria-hidden=\"true\" style=\"width: 34px; height: auto; margin-left: auto; opacity: 0.9;\">\n          <\/div>\n          <h3 style=\"font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--text-strong); margin: 0 0 6px;\">Your RBT<\/h3>\n          <div style=\"font-family: var(--font-display); fon ter-spacing: -0.02em; color: var(--rh-teal-900); margin: 0 0 16px; text-wrap: balance;\">Watch your child surprise you<\/h2>\n      <p style=\"font-size: 19px; line-height: 1.6; color: var(--rh-teal-800); margin: 0 0 24px;\">Together, we'll help them reach the milestones you're dreaming of. Schedule a free consultation and let's talk about what's possible.<\/p>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px;\">\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(6,47,51,0.1); color: var(--rh-teal-900); font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;\">\u2713 Medicaid accepted<\/span>\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(6,47,51,0.1); color: var(--rh-teal-900); font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;\">\u2713 We come to you<\/span>\n        <span style=\"display: inline-flex; align-items: center; gap: 7px; background: rgba(6,47,51,0.1); color: var(--rh-teal-900); font-family: var(--font-display); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;\">\u2713 No waitlist<\/span>\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px;\">\n        <a href=\"tel:+13853803211\" style=\"display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 32px; background: var(--rh-teal-900); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 18px; text-decoration: none; border-radius: var(--radius-pill); box-shadow: var(--shadow-md);\">\n          <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V2 s://reachhigheraba.com/privacy-policy/\" style=\"color: rgba(255,255,255,0.85); text-decoration: underline;\">Privacy Policy<\/a><\/div>\n    <\/div>\n  <\/footer>\n\n  <!-- STICKY MOBILE CALL BAR -->\n  <div class=\"rh-callbar\" style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 10px 12px; gap: 10px; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border-subtle); box-shadow: 0 -4px 20px rgba(6,47,51,0.12);\">\n    <a href=\"tel:+13853803211\" style=\"flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; background: var(--rh-green-500); color: var(--rh-teal-900); font-family: var(--font-display); font-weight: 700; font-size: 16px; text-decoration: none; border-radius: var(--radius-pill);\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.57 3.6 1 1 0 01-.24 1l-2.23 2.2z\" fill=\"currentColor\"><\/path><\/svg>\n      Call now\n    <\/a>\n    <a href=\"#quiz\" style=\"flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 50px; background: var(--rh-teal-700); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 16px; text-decoration: none; border-radius: var(--radius-pill);\">See if we fit<\/a>\n  <\/div>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { step: 1, answers: {}, submitted: false, form: { name: '', phone: '', email: '', zip: '' } };\n\n  choose(key, val, next) {\n    this.setState(s => ({ answers: { ...s.answers, [key]: val }, step: next }));\n  }\n\n  optStyle(selected) {\n    return {\n      display: 'flex', alignItems: 'center', width: '100%', textAlign: 'left',\n      minHeight: '54px', padding: '0 20px', cursor: 'pointer',\n      fontFamily: 'var(--font-body)', fontSize: '16px', fontWeight: 600,\n      color: selected ? 'var(--rh-teal-900)' : 'var(--text-body)',\n      background: selected ? 'var(--rh-green-100)' : '#fff',\n      border: selected ? '2px solid var(--rh-green-500)' : '2px solid var(--border-subtle)',\n      borderRadius: '14px',\n      transition: 'border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out)',\n    };\n  }\n\n  makeOpts(labels, key, next, selectMode) {\n    const sel = this.state.answers[key];\n    return labels.map(label => {\n      const selected = selectMode && sel === label;\n      return {\n        label,\n        style: this.optStyle(selected),\n        onClick: selectMode\n          ? () => this.setState(s => ({ answers: { ...s.answers, [key]: label } }))\n          : () => this.choose(key, label, next),\n        onOver: (e) => { if (!selected) { e.currentTarget.style.borderColor = 'var(--rh-green-400)'; e.currentTarget.style.background = 'var(--rh-green-50)'; } },\n        onOut: (e) => { if (!selected) { e.currentTarget.style.borderColor = 'var(--border-subtle)'; e.currentTarget.style.background = '#fff'; } },\n      };\n    });\n  }\n\n  field(k) { return (e) => this.setState(s => ({ form: { ...s.form, [k]: e.target.value } })); }\n\n  submit(e) {\n    e.preventDefault();\n    const payload = { ...this.state.form, quiz: this.state.answers };\n    console.log('Lead payload (wire to CRM/webhook):', payload);\n    this.setState({ submitted: true });\n  }\n\n  renderVals() {\n    const { step, answers, submitted, form } = this.state;\n    const isResult = step === 'result';\n    const stepNum = isResult ? 3 : step;\n    const fieldStyle = {\n      width: '100%', minHeight: '50px', padding: '0 16px', boxSizing: 'border-box',\n      fontFamily: 'var(--font-body)', fontSize: '16px', color: 'var(--text-strong)',\n      background: '#fff', border: '1px solid var(--border-subtle)', borderRadius: '10px', outline: 'none',\n    };\n    const h = React.createElement;\n    const svg = (paths) => h('svg', { width: 26, height: 26, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, paths.map((d, i) => h('path', { key: i, d })));\n    const reasons = [\n      { title: 'Personalized for your child', body: \"Plans are designed by certified professionals around each child's strengths, challenges, and goals.\", icon: svg(['M12 21s-7-4.5-9.5-9A5 5 0 0112 5a5 5 0 019.5 7c-2.5 4.5-9.5 9-9.5 9z']) },\n      { title: 'Learning in real life', body: 'Therapy happens where your child lives and learns, so skills transfer naturally to home and community.', icon: svg(['M3 11l9-7 9 7', 'M5 10v9h14v-9', 'M9 19v-5h6v5']) },\n      { title: 'Evidence-based', body: 'Decades of research and practice make ABA one of the most proven, effective therapies available.', icon: svg(['M9 3h6v4a3 3 0 01-.9 2.1L12 12l-2.1-2.9A3 3 0 019 7z', 'M6 21h12', 'M9 12l-3 9M15 12l3 9']) },\n      { title: 'Measurable progress', body: 'We track progress consistently, so you can see how your child is growing and where to focus next.', icon: svg(['M3 3v18h18', 'M7 14l4-4 3 3 5-6']) },\n    ];\n    return {\n      showProgress: !isResult,\n      stepNum,\n      progressWidth: (isResult ? 100 : Math.round((step / 3) * 100)) + '%',\n      isStep1: step === 1, isStep2: step === 2, isStep3: step === 3, isResult,\n      q1Options: this.makeOpts(['Under 3 years', '3\u20136 years', '7\u201312 years', '13+ years'], 'q1', 2, false),\n      q2Options: this.makeOpts(['Yes, diagnosed', 'Evaluation in progress', 'Not yet'], 'q2', 3, false),\n      q3Options: this.makeOpts(['As soon as possible', 'Within a month or two', 'Just exploring options'], 'q3', null, true),\n      continueDisabled: !answers.q3,\n      continueToResult: () => { if (this.state.answers.q3) this.setState({ step: 'result' }); },\n      continueStyle: {\n        width: '100%', minHeight: '52px
